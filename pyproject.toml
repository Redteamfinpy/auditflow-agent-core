[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditflow-agent-core"
version = "0.1.0"
description = "AI agent for automated document review with auditability"
authors = [{name = "Your Name"}]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "pypdf>=4.0",
    "litellm>=1.0",
    "typer>=0.9"
]
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
auditflow = "cli:main"

[tool.setuptools.packages.find]
where = ["src"]
